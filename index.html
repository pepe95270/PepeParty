<style>

    width: 100%; height: 100%; overflow: hidden;

    display: flex; flex-direction: column; align-items: center; justify-content: center;

  #boot h1 {
    font-family: "Arial Black", Impact, sans-serif;
    font-size: clamp(28px, 7vw, 68px);

    background: linear-gradient(#fff 10%, #ffe27a 45%, #f0a020 90%);

    text-shadow: 0 4px 0 rgba(0,0,0,.35);

    justify-content: space-between;

  #mobile-controller.hidden { display: none; }

  #mc-join {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 18vh;
    pointer-events: auto;
  }
  #mc-join-btn {
    font-size: 18px;
    padding: 10px 16px;
    border-radius: 8px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(4px);
  }

  .mc-panel {
    width: 45%;
    height: 36vh;
    pointer-events: auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #mc-left, #mc-right {
    background: rgba(0,0,0,0.28);
    border-radius: 14px;
    margin: 6px;
    touch-action: none;
    display:flex;
    flex-direction:column;
    align-items:center;

  .mc-joystick {
    width: 120px;

    background: rgba(255,255,255,0.06);
    border-radius: 50%;
    position: relative;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.4);
  }
  .mc-joystick::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 44px;
    height: 44px;
    transform: translate(-50%,-50%);
    background: rgba(255,255,255,0.12);
    border-radius: 50%;
  }

  .mc-action {
    display: block;
    margin: 8px;
    padding: 14px 18px;
    font-size: 16px;
    border-radius: 12px;
    background: rgba(255,255,255,0.12);
    color: #fff;
    border: none;
    min-width: 110px;
    text-align:center;
    -webkit-tap-highlight-color: transparent;
  }
  .mc-action.active { transform: translateY(1px); box-shadow: 0 1px 0 rgba(0,0,0,0.6) inset; }

  /* Diagnostics overlay */
  #diag { position: fixed; left: 8px; top: 8px; z-index: 10001; background: rgba(0,0,0,0.65); color: #fff; padding: 8px 10px; border-radius: 8px; font-size: 12px; max-width: 45%; max-height: 60vh; overflow: auto; }
  #diag .line { margin-bottom: 6px; }

<script>
  // Rapport d'erreur visible : indispensable sans console ouverte.
  (function () {
    function show(msg) {
      var e = document.getElementById('err');
      e.style.display = 'block';
      e.textContent += msg + '\n\n';
    }
    window.addEventListener('error', function (ev) {
      show('ERREUR : ' + ev.message + '\n  ' + (ev.filename || '') + ':' + (ev.lineno || '') +
           (ev.error && ev.error.stack ? '\n' + ev.error.stack : ''));
    });
    window.addEventListener('unhandledrejection', function (ev) {
      show('PROMESSE REJETÉE : ' + (ev.reason && ev.reason.stack ? ev.reason.stack : ev.reason));
    });
  })();
</script>

<!-- Mobile controller JS (auto-init) -->
<script>
(function () {
  const storageKey = 'pepeParty_mobileControllerAssigned';

  function isMobile() {
    return /Mobi|Android|iPhone|iPad|iPod|Opera Mini|IEMobile/i.test(navigator.userAgent)
      || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  }

  function dispatchControlEvent(detail) {
    window.dispatchEvent(new CustomEvent('pepe-mobile-controller', { detail }));
  }

  function initMobileController(opts = {}) {
    const root = document.getElementById('mobile-controller');
    if (!root) return;
    const joinBtn = document.getElementById('mc-join-btn');
    const mcUI = document.getElementById('mc-ui');
    const mcJoin = document.getElementById('mc-join');

    if (!isMobile()) {
      root.classList.add('hidden');
      return;
    }
    root.classList.remove('hidden');

    const alreadyAssigned = !!localStorage.getItem(storageKey);
    if (alreadyAssigned) {
      mcJoin.style.display = 'none';
      mcUI.classList.remove('hidden');
      root.setAttribute('aria-hidden', 'false');
    }

    joinBtn.addEventListener('click', () => {
      localStorage.setItem(storageKey, Date.now().toString());
      mcJoin.style.display = 'none';
      mcUI.classList.remove('hidden');
      root.setAttribute('aria-hidden', 'false');
      dispatchControlEvent({ type: 'joined', timestamp: Date.now() });
      if (opts.onJoin) opts.onJoin();
    });

    // Joystick handling
    const joystick = document.getElementById('mc-joystick');
    let activeId = null;
    function getPosFromTouch(t) {
      const rect = joystick.getBoundingClientRect();
      return { x: t.clientX - (rect.left + rect.width/2), y: t.clientY - (rect.top + rect.height/2) };
    }
    function norm(vx, vy) {
      const max = 50;
      return { x: Math.max(-1, Math.min(1, vx / max)), y: Math.max(-1, Math.min(1, vy / max)) };
    }

    joystick.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const t = e.changedTouches[0];
      activeId = t.identifier;
      const origin = getPosFromTouch(t);
      dispatchControlEvent({ type: 'joystick-start', origin });
      if (opts.onEvent) opts.onEvent({ type: 'joystick-start', origin });
    }, { passive: false });

    joystick.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (activeId === null) return;
      for (let i=0;i<e.changedTouches.length;i++){
        const t = e.changedTouches[i];
        if (t.identifier === activeId) {
          const pos = getPosFromTouch(t);
          const n = norm(pos.x, pos.y);
          dispatchControlEvent({ type: 'joystick', x: n.x, y: n.y });
          if (opts.onEvent) opts.onEvent({ type: 'joystick', x: n.x, y: n.y });
        }
      }
    }, { passive: false });

    joystick.addEventListener('touchend', (e) => {
      e.preventDefault();
      for (let i=0;i<e.changedTouches.length;i++){
        const t = e.changedTouches[i];
        if (t.identifier === activeId) {
          activeId = null;
          dispatchControlEvent({ type: 'joystick-end' });
          if (opts.onEvent) opts.onEvent({ type: 'joystick-end' });
        }
      }
    }, { passive: false });

    // Buttons
    document.querySelectorAll('.mc-action').forEach(btn => {
      const action = btn.getAttribute('data-action');
      btn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        btn.classList.add('active');
        dispatchControlEvent({ type: 'button-down', action });
        if (opts.onEvent) opts.onEvent({ type: 'button-down', action });
      }, { passive: false });
      btn.addEventListener('touchend', (e) => {
        e.preventDefault();
        btn.classList.remove('active');
        dispatchControlEvent({ type: 'button-up', action });
        if (opts.onEvent) opts.onEvent({ type: 'button-up', action });
      }, { passive: false });
      btn.addEventListener('touchcancel', (e) => {
        e.preventDefault();
        btn.classList.remove('active');
        dispatchControlEvent({ type: 'button-up', action });
        if (opts.onEvent) opts.onEvent({ type: 'button-up', action });
      }, { passive: false });
    });

    return {
      isAssigned: () => !!localStorage.getItem(storageKey),
      release: () => localStorage.removeItem(storageKey)
    };
  }

  if (typeof window !== 'undefined') {
    window.initMobileController = initMobileController;
    document.addEventListener('DOMContentLoaded', () => { initMobileController(); });
  }
})();
</script>

<!-- Auto-hide loading overlay on window.load with fallback -->
<script>
(function(){
  function hideLoading(){
    try{
      var l = document.getElementById('loading');
      if(l) l.classList.add('hidden');
    }catch(e){/* ignore */}
  }
  if(document.readyState === 'complete') hideLoading();
  else window.addEventListener('load', hideLoading, { once: true });
  // Fallback for environments where load may not fire or a script crashes
  setTimeout(hideLoading, 8000);
})();
</script>

<!-- Diagnostics script: show runtime status & create fallback canvas if no renderer found -->
<script>
(function(){
  function logLine(k,v){ const d = document.getElementById('diag'); if(!d) return; const el=document.createElement('div'); el.className='line'; el.textContent = k+': '+v; d.appendChild(el); }
  function clearDiag(){ const d=document.getElementById('diag'); if(d) d.innerHTML=''; }
  function createFallbackCanvas(){ try{
    const game=document.getElementById('game');
    if(!game) return false;
    // if there's already a canvas, do nothing
    if(game.querySelector('canvas')) return false;
    const fb=document.createElement('canvas'); fb.width=window.innerWidth; fb.height=window.innerHeight; fb.style.width='100%'; fb.style.height='100%';
    fb.style.display='block'; fb.style.background='#000'; fb.style.zIndex='1';
    const ctx=fb.getContext('2d'); ctx.fillStyle='#fff'; ctx.font='20px sans-serif'; ctx.textAlign='center';
    ctx.fillText('Aucun renderer détecté', fb.width/2, fb.height/2 - 10);
    ctx.font='14px sans-serif'; ctx.fillText('Vérifie la console ou contacte dev', fb.width/2, fb.height/2 + 20);
    game.appendChild(fb);
    return true;
  }catch(e){return false;} }
  function status(){ try{
    clearDiag();
    logLine('UA', navigator.userAgent.slice(0,80));
    logLine('readyState', document.readyState);
    logLine('THREE', typeof THREE);
    logLine('MP', typeof MP);
    const game=document.getElementById('game'); logLine('game elem', !!game);
    const canvas = game ? game.querySelector('canvas') : null; logLine('canvas present', !!canvas);
    if(canvas){ logLine('canvas size', canvas.width+'x'+canvas.height+' css:'+canvas.clientWidth+'x'+canvas.clientHeight); }
    else { const created = createFallbackCanvas(); logLine('fallback canvas', created ? 'created' : 'not created'); }
    const err=document.getElementById('err'); if(err && err.style.display!=='none'){ logLine('ERRORS', err.textContent.slice(0,300)); }
  }catch(e){/* ignore */} }
  window.addEventListener('load', status);
  setTimeout(status, 1200);
  // tap to hide/show
  const d=document.getElementById('diag'); if(d){ d.addEventListener('click', ()=>{ d.style.display = d.style.display==='none' ? 'block' : 'none'; }); }
})();
</script>
