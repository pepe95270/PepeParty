   * Analyse une couleur et renvoie {r,g,b,a} (composantes 0..255, alpha 0..1).
   * Accepte "#rgb", "#rrggbb", "rgb(...)", "rgba(...)" et 0xrrggbb.
   * Les formes rgba() sont indispensables : beaucoup de panneaux d'interface
   * sont semi-transparents, et ils passent malgré tout par shade()/mixHex().

      const h = s.slice(1);
      if (h.length === 3) {
        return {
          r: parseInt(h.charAt(0) + h.charAt(0), 16),
          g: parseInt(h.charAt(1) + h.charAt(1), 16),
          b: parseInt(h.charAt(2) + h.charAt(2), 16),
          a: 1,
        };

        r: parseInt(h.slice(0, 2), 16) || 0,
        g: parseInt(h.slice(2, 4), 16) || 0,
        b: parseInt(h.slice(4, 6), 16) || 0,
        a: h.length >= 8 ? (parseInt(h.slice(6, 8), 16) || 0) / 255 : 1,

  U.hex = (r, g, b, a) => {
    const cl = (v) => U.clamp(Math.round(v), 0, 255);
    if (a !== undefined && a < 1) {
      return 'rgba(' + cl(r) + ',' + cl(g) + ',' + cl(b) + ',' + (Math.round(a * 1000) / 1000) + ')';

    const o = U.rgb(c);

    else if (h < 120) { r = x; g = c; }
    else if (h < 180) { g = c; b = x; }

  U.dist2 = (ax, az, bx, bz) => { const dx = bx - ax, dz = bz - az; return dx * dx + dz * dz; };

  /**
   * Classe des scores (haut = meilleur par défaut) en gérant les ex aequo.
   * Retourne [{index, score, rank}] trié, rank commençant à 0, ex aequo = même rank.
   */

    const arr = scores.map((s, i) => ({ index: i, score: s }));
    arr.sort((a, b) => (lowerIsBetter ? a.score - b.score : b.score - a.score));

    for (let i = 0; i < arr.length; i++) {
      if (i > 0 && arr[i].score !== arr[i - 1].score) rank = i;

   * Petit gestionnaire de tweens temporels. Utilisé partout pour les
   * animations d'UI et de plateau sans dépendance externe.
   */

        const k = U.clamp(t.t / t.dur, 0, 1);

  /** Attente simple basée sur setTimeout, utile hors boucle de rendu. */
  U.sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // ------------------------------------------------------------ conteneurs
  /** Pool d'objets simple, évite le GC dans les mini-jeux à particules. */
  class Pool {
    constructor(factory, reset) { this.factory = factory; this.reset = reset; this.free = []; this.used = []; }
    get() {
      const o = this.free.pop() || this.factory();
      this.used.push(o);
      return o;
    }
    release(o) {
      const i = this.used.indexOf(o);
      if (i >= 0) this.used.splice(i, 1);
      if (this.reset) this.reset(o);
      this.free.push(o);
    }
    releaseAll() {
      while (this.used.length) this.release(this.used[this.used.length - 1]);
    }
  }
  U.Pool = Pool;

  // -------------------------------------------------------------- stockage
  const SAVE_KEY = 'mp64.save.v1';
  U.storage = {
    load() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    },
    save(obj) {
      try { localStorage.setItem(SAVE_KEY, JSON.stringify(obj)); return true; }
      catch (e) { return false; }
    },
    clear() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} },
  };
})(window.MP = window.MP || {});
