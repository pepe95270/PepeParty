<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pepe Party</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #05060c;
    font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
    color: #fff;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #game { position: absolute; inset: 0; }
  #game canvas { display: block; }
  #gl  { z-index: 1; }
  #hud { z-index: 2; pointer-events: none; }

  /* --- écran de démarrage (avant le premier clic) --------------------- */
  #boot {
    position: absolute; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 40%, #1c2c68 0%, #080c20 70%, #04060e 100%);
    cursor: pointer; text-align: center; padding: 24px;
  }
  #boot h1 {
    font-family: "Arial Black", Impact, sans-serif;
    font-size: clamp(28px, 7vw, 68px);
    letter-spacing: 2px; line-height: 1.05;
    background: linear-gradient(#fff 10%, #ffe27a 45%, #f0a020 90%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 4px 0 rgba(0,0,0,.35);
    margin-bottom: 6px;
  }
  #boot h2 {
    font-size: clamp(12px, 2.4vw, 19px); font-weight: normal;
    color: #9fb6e8; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 38px;
  }
  #boot .start {
    font-size: clamp(15px, 3vw, 24px); font-weight: bold; color: #fff;
    padding: 14px 40px; border: 3px solid #fff; border-radius: 40px;
    background: rgba(255,255,255,.08);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: .85 } 50% { transform: scale(1.05); opacity: 1 } }
  #boot .note { margin-top: 34px; font-size: 13px; color: #6f83b0; line-height: 1.7; max-width: 520px; }
  #boot .note b { color: #a8c0f0; }
  #boot.hidden { display: none; }

  #loading {
    position: absolute; inset: 0; z-index: 40;
    display: flex; align-items: center; justify-content: center;
    background: #05060c; font-size: 18px; color: #7f90c0; letter-spacing: 3px;
  }
  #loading.hidden { display: none; }

  #err {
    position: absolute; inset: 0; z-index: 99; display: none;
    background: #1a0808; color: #ffb0b0; padding: 30px; overflow: auto;
    font-family: monospace; font-size: 13px; white-space: pre-wrap; line-height: 1.5;
  }

  /* === Mobile controller styles (added) === */
  #mobile-controller {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 12px;
  }
  #mobile-controller.hidden { display: none; }

  #mc-join {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 18vh;
    pointer-events: auto;
  }
  #mc-join-btn {
    font-size: 18px;
    padding: 10px 16px;
    border-radius: 8px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(4px);
  }

  .mc-panel {
    width: 45%;
    height: 36vh;
    pointer-events: auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #mc-left, #mc-right {
    background: rgba(0,0,0,0.28);
    border-radius: 14px;
    margin: 6px;
    touch-action: none;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }

  .mc-joystick {
    width: 120px;
    height: 120px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
    position: relative;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.4);
  }
  .mc-joystick::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 44px;
    height: 44px;
    transform: translate(-50%,-50%);
    background: rgba(255,255,255,0.12);
    border-radius: 50%;
  }

  .mc-action {
    display: block;
    margin: 8px;
    padding: 14px 18px;
    font-size: 16px;
    border-radius: 12px;
    background: rgba(255,255,255,0.12);
    color: #fff;
    border: none;
    min-width: 110px;
    text-align:center;
    -webkit-tap-highlight-color: transparent;
  }
  .mc-action.active { transform: translateY(1px); box-shadow: 0 1px 0 rgba(0,0,0,0.6) inset; }

  /* Diagnostics overlay (non-intrusive) */
  #diag { position: fixed; left: 8px; top: 8px; z-index: 10001; background: rgba(0,0,0,0.55); color: #fff; padding: 6px 8px; border-radius: 8px; font-size: 12px; max-width: 46%; max-height: 60vh; overflow: auto; pointer-events: auto; }
  #diag .line { margin-bottom: 6px; }
  #diag small { display:block; color: #9fb6e8; margin-top:4px; }
</style>
</head>
<body>

<div id="game"></div>

<div id="loading">CHARGEMENT…</div>

<div id="boot" class="hidden">
  <h1>PEPE<br>PARTY</h1>
  <h2>Le grand jeu de plateau</h2>
  <div class="start">CLIQUEZ POUR JOUER</div>
  <div class="note">
    <b>1 à 4 joueurs</b> — clavier partagé ou manettes<br>
    J1 : Flèches + Espace &nbsp;·&nbsp; J2 : ZQSD + C &nbsp;·&nbsp; J3 : IJKL + N &nbsp;·&nbsp; J4 : Pavé num.<br>
    Les manettes branchées sont détectées automatiquement.<br>
    <b>Le son démarre coupé — appuyez sur M pour l'activer.</b>
  </div>
</div>

<!-- Mobile controller UI inserted (hidden by default to avoid interfering) -->
<div id="mobile-controller" class="hidden" aria-hidden="true">
  <div id="mc-join">
    <button id="mc-join-btn">Rejoindre comme contrôleur</button>
  </div>

  <div id="mc-ui" class="hidden" style="width:100%;display:flex;justify-content:space-between;align-items:flex-end;">
    <div id="mc-left" class="mc-panel" aria-hidden="false">
      <div id="mc-joystick" class="mc-joystick" role="application" aria-label="Joystick"></div>
    </div>

    <div id="mc-right" class="mc-panel" aria-hidden="false">
      <button class="mc-action" data-action="jump">Saut</button>
      <button class="mc-action" data-action="action">Action</button>
    </div>
  </div>
</div>

<div id="err"></div>

<div id="diag" aria-hidden="false" style="display:none"></div>

<script>
  // Rapport d'erreur visible : indispensable sans console ouverte.
  (function () {
    function show(msg) {
      var e = document.getElementById('err');
      e.style.display = 'block';
      e.textContent += msg + '\n\n';
    }
    window.addEventListener('error', function (ev) {
      show('ERREUR : ' + ev.message + '\n  ' + (ev.filename || '') + ':' + (ev.lineno || '') +
           (ev.error && ev.error.stack ? '\n' + ev.error.stack : ''));
    });
    window.addEventListener('unhandledrejection', function (ev) {
      show('PROMESSE REJETÉE : ' + (ev.reason && ev.reason.stack ? ev.reason.stack : ev.reason));
    });
  })();
</script>

<!-- Mobile controller JS (auto-init disabled to avoid interfering); safe to call window.initMobileController() manually -->
<script>
(function () {
  const storageKey = 'pepeParty_mobileControllerAssigned';

  function isMobile() {
    return /Mobi|Android|iPhone|iPad|iPod|Opera Mini|IEMobile/i.test(navigator.userAgent)
      || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  }

  function dispatchControlEvent(detail) {
    try { window.dispatchEvent(new CustomEvent('pepe-mobile-controller', { detail })); } catch(e){}
  }

  function initMobileController(opts = {}) {
    try {
      const root = document.getElementById('mobile-controller');
      if (!root) return;
      // keep UI hidden by default to avoid blocking rendering; caller can unhide
      if (!isMobile()) { root.classList.add('hidden'); return; }

      const joinBtn = document.getElementById('mc-join-btn');
      const mcUI = document.getElementById('mc-ui');
      const mcJoin = document.getElementById('mc-join');

      // do not force show; let caller decide
      // if already assigned, show UI
      const alreadyAssigned = !!localStorage.getItem(storageKey);
      if (alreadyAssigned) {
        mcJoin.style.display = 'none';
        mcUI.classList.remove('hidden');
        root.classList.remove('hidden');
        root.setAttribute('aria-hidden', 'false');
      }

      joinBtn && joinBtn.addEventListener('click', () => {
        localStorage.setItem(storageKey, Date.now().toString());
        mcJoin.style.display = 'none';
        mcUI.classList.remove('hidden');
        root.classList.remove('hidden');
        root.setAttribute('aria-hidden', 'false');
        dispatchControlEvent({ type: 'joined', timestamp: Date.now() });
        if (opts.onJoin) opts.onJoin();
      });

      // Joystick handling (safe guards)
      const joystick = document.getElementById('mc-joystick');
      let activeId = null;
      function getPosFromTouch(t) {
        const rect = joystick.getBoundingClientRect();
        return { x: t.clientX - (rect.left + rect.width/2), y: t.clientY - (rect.top + rect.height/2) };
      }
      function norm(vx, vy) {
        const max = 50;
        return { x: Math.max(-1, Math.min(1, vx / max)), y: Math.max(-1, Math.min(1, vy / max)) };
      }

      if (joystick) {
        joystick.addEventListener('touchstart', (e) => {
          e.preventDefault();
          const t = e.changedTouches[0];
          activeId = t.identifier;
          const origin = getPosFromTouch(t);
          dispatchControlEvent({ type: 'joystick-start', origin });
          if (opts.onEvent) opts.onEvent({ type: 'joystick-start', origin });
        }, { passive: false });

        joystick.addEventListener('touchmove', (e) => {
          e.preventDefault();
          if (activeId === null) return;
          for (let i=0;i<e.changedTouches.length;i++){
            const t = e.changedTouches[i];
            if (t.identifier === activeId) {
              const pos = getPosFromTouch(t);
              const n = norm(pos.x, pos.y);
              dispatchControlEvent({ type: 'joystick', x: n.x, y: n.y });
              if (opts.onEvent) opts.onEvent({ type: 'joystick', x: n.x, y: n.y });
            }
          }
        }, { passive: false });

        joystick.addEventListener('touchend', (e) => {
          e.preventDefault();
          for (let i=0;i<e.changedTouches.length;i++){
            const t = e.changedTouches[i];
            if (t.identifier === activeId) {
              activeId = null;
              dispatchControlEvent({ type: 'joystick-end' });
              if (opts.onEvent) opts.onEvent({ type: 'joystick-end' });
            }
          }
        }, { passive: false });
      }

      // Buttons
      document.querySelectorAll('.mc-action').forEach(btn => {
        const action = btn.getAttribute('data-action');
        btn.addEventListener('touchstart', (e) => {
          e.preventDefault();
          btn.classList.add('active');
          dispatchControlEvent({ type: 'button-down', action });
          if (opts.onEvent) opts.onEvent({ type: 'button-down', action });
        }, { passive: false });
        btn.addEventListener('touchend', (e) => {
          e.preventDefault();
          btn.classList.remove('active');
          dispatchControlEvent({ type: 'button-up', action });
          if (opts.onEvent) opts.onEvent({ type: 'button-up', action });
        }, { passive: false });
        btn.addEventListener('touchcancel', (e) => {
          e.preventDefault();
          btn.classList.remove('active');
          dispatchControlEvent({ type: 'button-up', action });
          if (opts.onEvent) opts.onEvent({ type: 'button-up', action });
        }, { passive: false });
      });

      // return simple API
      return {
        isAssigned: () => !!localStorage.getItem(storageKey),
        release: () => localStorage.removeItem(storageKey),
        showUI: () => { const r=document.getElementById('mobile-controller'); if(r) r.classList.remove('hidden'); }
      };
    } catch (err) {
      // ensure controller init never throws and blocks other scripts
      try { document.getElementById('mobile-controller') && document.getElementById('mobile-controller').classList.add('hidden'); } catch(e){}
      return null;
    }
  }

  // expose but DO NOT auto-init to avoid interfering with rendering.
  if (typeof window !== 'undefined') window.initMobileController = initMobileController;
})();
</script>

<!-- Auto-hide loading overlay on window.load with fallback -->
<script>
(function(){
  function hideLoading(){
    try{
      var l = document.getElementById('loading');
      if(l) l.classList.add('hidden');
    }catch(e){/* ignore */}
  }
  if(document.readyState === 'complete') hideLoading();
  else window.addEventListener('load', hideLoading, { once: true });
  // Fallback for environments where load may not fire or a script crashes
  setTimeout(hideLoading, 8000);
})();
</script>

<!-- Non-intrusive diagnostics & visible init steps (disabled by default) -->
<script>
(function(){
  // Enable diagnostics & mobile controller manually by setting these flags in the console or via a bookmarklet
  // e.g. window.__pp_enable_diag = true; window.__pp_enable_mobile = true;
  const diagEnabled = !!window.__pp_enable_diag;
  const diag = document.getElementById('diag');
  function showDiag(){ if(!diagEnabled) return; if(!diag) return; diag.style.display='block'; }
  function logLine(k,v){ if(!diagEnabled) return; if(!diag) return; const el=document.createElement('div'); el.className='line'; el.textContent = k+': '+v; diag.appendChild(el); }
  function clearDiag(){ if(!diagEnabled) return; if(!diag) return; diag.innerHTML=''; }

  function statusOnce(){ try{
    if(!diagEnabled) return;
    clearDiag();
    logLine('UA', navigator.userAgent.slice(0,120));
    logLine('readyState', document.readyState);
    logLine('THREE', typeof THREE);
    logLine('MP', typeof MP);
    const game=document.getElementById('game'); logLine('game elem', !!game);
    const canvas = game ? game.querySelector('canvas') : null; logLine('canvas present', !!canvas);
    const err=document.getElementById('err'); if(err && err.style.display!=='none'){ logLine('ERRORS', err.textContent.slice(0,300)); }
    // show small hint to user
    if(diag) { const s=document.createElement('small'); s.textContent='Diag active — tape ici pour fermer'; diag.appendChild(s); diag.addEventListener('click', ()=>{ diag.style.display='none'; }); }
  }catch(e){}
  }

  // do not auto-create fallback canvas (it can cover the real renderer). Only show diagnostics if explicitly enabled.
  window.addEventListener('load', statusOnce);
  setTimeout(statusOnce, 1200);
  // expose helper to manually show more diagnostics
  window.PP_showDiag = function(){ window.__pp_enable_diag = true; showDiag(); statusOnce(); };
})();
</script>
